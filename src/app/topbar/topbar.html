<header
  class="bg-white border-b border-slate-200 sticky top-0 z-20">
  <div
    class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
    <div class="flex items-center space-x-3">
      <a
        [routerLink]="routes.ORDERS"
        class="flex items-center space-x-3 cursor-pointer">
        <app-logo />
      </a>
    </div>

    <div class="flex items-center space-x-3">
      <nav class="hidden md:flex items-center gap-1">
        <a
          [routerLink]="routes.ORDERS"
          routerLinkActive="text-emerald-700 bg-emerald-50"
          class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
          Orders
        </a>
        <a
          [routerLink]="routes.CLIENTS"
          routerLinkActive="text-emerald-700 bg-emerald-50"
          class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
          Clients
        </a>
      </nav>
      <div class="relative">
        <button
          (click)="showUserMenu = !showUserMenu"
          class="w-9 h-9 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center justify-center font-bold text-sm">
          {{ auth.initials || 'YB' }}
        </button>
        @if (showUserMenu) {
          <div
            class="absolute right-0 mt-2 w-40 bg-white border border-slate-200 rounded-xl shadow-lg z-50 overflow-hidden">
            <div
              class="px-4 py-2.5 text-xs text-slate-400 border-b border-slate-100 truncate">
              {{ auth.username() }}
              <span class="block text-[10px] font-semibold text-slate-600">{{ UserRoleLabel[auth.currentUser()?.role!] }} · {{ auth.currentUser()?.shopName }}</span>
              <span class="block text-[10px] text-slate-400">{{ orders.orders().length }} total orders</span>
              @if (auth.currentUser()?.email) {
                <span class="block text-[10px] font-semibold text-slate-600 truncate">{{ auth.currentUser()?.email }}</span>
              }
            </div>
            <div class="p-2">
              <app-button label="Logout" [variant]="ButtonVariant.Danger" [size]="ButtonSize.Sm" [width]="ButtonWidth.Full" (clicked)="logout()" />
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</header>
