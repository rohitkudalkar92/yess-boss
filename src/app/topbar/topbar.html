<header
  class="bg-white border-b border-slate-200 sticky top-0 z-20">
  <div
    class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
    <div class="flex items-center space-x-3">
      <button
        (click)="showSidebar = true"
        class="md:hidden p-2 text-slate-600 hover:text-slate-900 focus:outline-none">
        <app-icon
          [name]="IconName.Menu"
          [cls]="'w-6 h-6'" />
      </button>
      <a
        [routerLink]="routes.DASHBOARD"
        class="flex items-center space-x-3 cursor-pointer">
        <div
          class="bg-slate-800 text-white p-2 rounded-lg font-bold text-lg leading-none">
          YB
        </div>
        <div class="flex flex-col leading-tight">
          <span
            class="font-bold text-lg sm:text-xl text-slate-900 truncate"
            >Yes Boss</span
          >
          <span
            class="text-xs font-medium text-slate-400 tracking-widest uppercase"
            >Men's Tailor</span
          >
        </div>
      </a>
    </div>

    <div
      class="hidden sm:flex items-center flex-1 max-w-xs md:max-w-md mx-4">
      <div class="relative w-full">
        <input
          type="text"
          placeholder="Search orders, clients..."
          class="w-full bg-slate-100 text-sm pl-9 pr-4 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-transparent transition" />
        <app-icon
          [name]="IconName.Search"
          [cls]="'w-4 h-4 text-slate-400 absolute left-3 top-3'" />
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <span class="md:hidden">
        <app-button [icon]="IconName.Plus" label="" [size]="ButtonSize.Md" (clicked)="showModal = true" />
      </span>
      <span class="hidden md:inline-flex">
        <app-button label="+ New Order" (clicked)="showModal = true" />
      </span>
      <span class="hidden md:inline-flex">
        <app-button label="+ New User" (clicked)="showUserModal = true" />
      </span>
      <div class="relative">
        <button
          (click)="showUserMenu = !showUserMenu"
          class="w-9 h-9 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center justify-center font-bold text-sm">
          {{ auth.initials || 'YB' }}
        </button>
        @if (showUserMenu) {
          <div
            class="absolute right-0 mt-2 w-40 bg-white border border-slate-200 rounded-xl shadow-lg z-50 overflow-hidden">
            <div
              class="px-4 py-2.5 text-xs text-slate-400 border-b border-slate-100 truncate">
              {{ auth.username() }}
            </div>
            <app-button label="Logout" [variant]="ButtonVariant.Danger" [size]="ButtonSize.Sm" [width]="ButtonWidth.Full" (clicked)="logout()" />
          </div>
        }
      </div>
    </div>
  </div>
</header>

@if (showModal) {
  <app-new-order-modal (closed)="showModal = false" />
}

@if (showUserModal) {
  <app-new-user-modal (closed)="showUserModal = false" />
}

@if (showSidebar) {
  <div class="md:hidden fixed inset-0 z-40 flex">
    <div
      class="fixed inset-0 bg-black/40"
      (click)="showSidebar = false"></div>
    <div
      class="relative w-72 bg-white h-full shadow-xl flex flex-col z-50">
      <div
        class="flex items-center justify-between px-5 py-4 border-b border-slate-200">
        <span class="font-bold text-slate-800 text-base"
          >Quick Directory</span
        >
        <app-button [icon]="IconName.Close" label="" [variant]="ButtonVariant.Ghost" [size]="ButtonSize.Sm" (clicked)="showSidebar = false" />
      </div>
      <nav class="flex-1 px-4 py-4 space-y-2">
        <a
          [routerLink]="routes.DASHBOARD"
          routerLinkActive="bg-emerald-50 text-emerald-700"
          (click)="showSidebar = false"
          class="flex items-center justify-between px-4 py-3 rounded-xl bg-slate-50 hover:bg-slate-100 transition font-medium text-sm text-slate-700">
          <span>Dashboard</span>
          <app-icon
            [name]="IconName.ArrowRight"
            [cls]="'w-4 h-4 text-slate-400'" />
        </a>
        <a
          [routerLink]="routes.MEASUREMENTS"
          routerLinkActive="bg-emerald-50 text-emerald-700"
          (click)="showSidebar = false"
          class="flex items-center justify-between px-4 py-3 rounded-xl bg-slate-50 hover:bg-slate-100 transition font-medium text-sm text-slate-700">
          <span>Client Measurements</span>
          <app-icon
            [name]="IconName.ArrowRight"
            [cls]="'w-4 h-4 text-slate-400'" />
        </a>
      </nav>
    </div>
  </div>
}
