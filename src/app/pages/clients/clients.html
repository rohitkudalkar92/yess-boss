<div class="flex flex-col h-full">
  <app-data-table
    title="Clients"
    [subtitle]="clients.length + ' total'"
    [columns]="columns"
    [rows]="clients"
    [searchable]="true"
    searchPlaceholder="Search by name..."
    [searchType]="InputType.Text"
    addLabel="+ New Client"
    [mobileFields]="mobileFields"
    (add)="showModal.set(true)"
    (edit)="editTarget.set($any($event))"
    (cellClick)="onCellClick($event)" />
</div>

@if (showModal() || editTarget()) {
  <app-client-modal
    [client]="editTarget()"
    (closed)="showModal.set(false); editTarget.set(null)" />
}
