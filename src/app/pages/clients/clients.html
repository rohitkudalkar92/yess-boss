<div class="flex flex-col h-full">
  <app-data-table
    title="Clients"
    [subtitle]="clients.length + ' total'"
    [columns]="columns"
    [rows]="clients"
    [searchable]="true"
    searchPlaceholder="Search by name..."
    addLabel="+ New Client"
    [mobileFields]="mobileFields"
    (add)="showModal.set(true)"
    (edit)="editTarget.set($any($event))"
    (delete)="deleteTarget.set($any($event))" />
</div>

@if (showModal() || editTarget()) {
  <app-client-modal
    [client]="editTarget()"
    (closed)="showModal.set(false); editTarget.set(null)" />
}

@if (deleteTarget()) {
  <app-confirm-modal
    title="Delete Client"
    [message]="'Are you sure you want to delete ' + deleteTarget()!.name + '? This action cannot be undone.'"
    confirmLabel="Delete"
    (confirmed)="confirmDelete()"
    (cancelled)="deleteTarget.set(null)" />
}
