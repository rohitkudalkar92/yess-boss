<button
  [type]="type"
  [disabled]="isDisabled"
  (click)="!isDisabled && clicked.emit()"
  [class]="
    'inline-flex items-center justify-center gap-2 font-semibold transition ' +
    variantClasses +
    ' ' +
    sizeClasses +
    ' ' +
    widthClass
  ">
  @if (isSpinner) {
    <svg
      class="w-4 h-4 animate-spin shrink-0"
      fill="none"
      viewBox="0 0 24 24">
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4" />
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
    </svg>
    {{ label }}
  }

  @if (isTextLoad) {
    {{ loadingText }}
  }

  @if (isIconLoad) {
    <svg
      class="w-4 h-4 animate-spin shrink-0"
      fill="none"
      viewBox="0 0 24 24">
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4" />
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
    </svg>
    {{ label }}
  }

  @if (!loading) {
    @if (icon && iconPosition === 'left') {
      <app-icon [name]="icon" cls="w-4 h-4 shrink-0" />
    }
    {{ label }}
    @if (icon && iconPosition === 'right') {
      <app-icon [name]="icon" cls="w-4 h-4 shrink-0" />
    }
  }
</button>
