<div class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-3 items-center">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium min-w-[260px] max-w-xs animate-fade-in"
      [class]="
        toast.type === 'success' ? 'bg-emerald-600 text-white' :
        toast.type === 'error'   ? 'bg-red-600 text-white' :
                                   'bg-slate-800 text-white'
      "
    >
      @if (toast.type === 'success') {
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
      }
      @if (toast.type === 'error') {
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      }
      @if (toast.type === 'info') {
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 100 20A10 10 0 0012 2z"/>
        </svg>
      }
      <span class="flex-1">{{ toast.message }}</span>
      <button (click)="toastService.dismiss(toast.id)" class="opacity-70 hover:opacity-100 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
</div>
