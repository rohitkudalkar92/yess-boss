<div class="bg-white px-5 py-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-4">
  <div class="flex flex-col gap-1">
    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">{{ label() }}</p>
    @if (badge()) {
      <span class="text-xs font-medium flex items-center gap-1 {{ badgeClass() }}">
        @if (icon()) {
          <app-icon [name]="icon()!" cls="w-3 h-3" />
        }
        {{ badge() }}
      </span>
    }
  </div>
  <p class="text-3xl font-extrabold text-slate-900 tabular-nums">{{ value() }}</p>
</div>
