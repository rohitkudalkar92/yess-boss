<button
  type="button"
  (click)="clicked.emit()"
  class="group w-full text-left bg-white rounded-2xl border transition-all duration-200 cursor-pointer
    {{ active()
      ? 'border-emerald-400 shadow-lg scale-[1.02]'
      : 'border-slate-200 shadow-sm hover:shadow-md hover:-translate-y-0.5' }}">

  <div class="p-4 sm:p-5">
    <div class="flex items-start justify-between gap-2">
      <div>
        <p class="text-xs font-semibold uppercase tracking-widest text-slate-400 leading-snug">{{ label() }}</p>
        @if (badge()) {
          <p class="text-xs font-medium mt-1 {{ badgeClass() }}">{{ badge() }}</p>
        }
      </div>
      <p class="text-3xl sm:text-4xl font-black tabular-nums leading-none shrink-0
        {{ active()
          ? (color() === 'emerald' ? 'text-emerald-600' :
             color() === 'amber'   ? 'text-amber-500' :
             color() === 'blue'    ? 'text-blue-600' :
                                     'text-red-500')
          : 'text-slate-900' }}">
        {{ value() }}
      </p>
    </div>
  </div>
</button>
