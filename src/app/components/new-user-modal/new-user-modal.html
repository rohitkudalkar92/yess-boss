<!-- Backdrop -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
  (click)="close()">
  <!-- Modal -->
  <div
    class="bg-white rounded-2xl shadow-xl w-full max-w-md flex flex-col"
    (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100">
      <div>
        <h2 class="text-base font-bold text-slate-900">New Client</h2>
        <p class="text-xs text-slate-400 mt-0.5">Add a client to your directory</p>
      </div>
      <button (click)="close()" class="text-slate-400 hover:text-slate-600 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <form #f="ngForm" class="px-6 py-5 space-y-4">
      <app-input
        label="Full Name"
        placeholder="e.g. James Patel"
        [type]="InputType.Text"
        [(ngModel)]="form.name"
        name="name"
        required />
      <app-input
        label="Phone Number"
        placeholder="e.g. +1-202-555-0141"
        [type]="InputType.Tel"
        [(ngModel)]="form.phone"
        name="phone" />
      <app-input
        label="Email"
        placeholder="e.g. james@example.com"
        [type]="InputType.Email"
        [(ngModel)]="form.email"
        name="email" />
      <app-input
        label="Age"
        placeholder="e.g. 32"
        [type]="InputType.Number"
        [(ngModel)]="form.age"
        name="age" />
    </form>

    <!-- Footer -->
    <div class="px-6 py-5 border-t border-slate-100 flex gap-3 [&>*]:flex-1">
      <app-button
        label="Cancel"
        [variant]="ButtonVariant.Secondary"
        [width]="ButtonWidth.Full"
        (clicked)="close()" />
      <app-button
        label="Add Client"
        [width]="ButtonWidth.Full"
        [disabled]="!form.name.trim()"
        (clicked)="submit()" />
    </div>
  </div>
</div>
