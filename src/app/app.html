<div
  class="h-screen overflow-hidden bg-slate-50 font-sans text-slate-800 flex flex-col pb-20 md:pb-0">
  @if (!isLanding) {
    <app-topbar />
  }

  @if (isLanding) {
    <router-outlet />
  } @else {
    <div class="flex-1 w-full px-4 sm:px-6 lg:px-8 py-8 overflow-y-auto">
      <main class="space-y-6">
        <router-outlet />
      </main>
    </div>

    <nav
      class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-30 flex">
      <a
        [routerLink]="routes.ORDERS"
        routerLinkActive="text-emerald-600 bg-emerald-50"
        class="flex-1 flex flex-col items-center justify-center py-3 text-slate-500 hover:text-emerald-600 transition text-xs font-medium gap-1">
        <app-icon [name]="IconName.Home" />
        Orders
      </a>
      <a
        [routerLink]="routes.CLIENTS"
        routerLinkActive="text-emerald-600 bg-emerald-50"
        class="flex-1 flex flex-col items-center justify-center py-3 text-slate-500 hover:text-emerald-600 transition text-xs font-medium gap-1">
        <app-icon [name]="IconName.Clients" />
        Clients
      </a>
    </nav>
  }

  <app-toast />
</div>
