<div
  class="h-screen bg-slate-50 font-sans text-slate-800 flex flex-col pb-20 md:pb-0 overflow-hidden">
  @if (!isLanding) {
    <app-topbar />
  }

  @if (isLanding) {
    <router-outlet />
  } @else {
    <div #scrollContainer class="flex-1 w-full px-3 sm:px-4 lg:px-6 py-3 sm:py-4 flex flex-col overflow-y-auto md:overflow-hidden md:min-h-0" (scroll)="onScroll($event)">
      <main class="flex-1 flex flex-col min-h-0">
        <router-outlet />
      </main>
    </div>

    @if (showScrollTop) {
      <button
        (click)="scrollToTop()"
        class="md:hidden fixed bottom-24 right-4 z-40 w-10 h-10 rounded-full bg-indigo-600 text-white shadow-lg flex items-center justify-center hover:bg-indigo-500 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
        </svg>
      </button>
    }

    <nav
      class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-30 flex">
      <a
        [routerLink]="routes.ORDERS"
        routerLinkActive="text-emerald-600 bg-emerald-50"
        class="flex-1 flex flex-col items-center justify-center py-3 text-slate-500 hover:text-emerald-600 transition text-xs font-medium gap-1">
        <app-icon [name]="IconName.Home" />
        Orders
      </a>
      <a
        [routerLink]="routes.CLIENTS"
        routerLinkActive="text-emerald-600 bg-emerald-50"
        class="flex-1 flex flex-col items-center justify-center py-3 text-slate-500 hover:text-emerald-600 transition text-xs font-medium gap-1">
        <app-icon [name]="IconName.Clients" />
        Clients
      </a>
    </nav>
  }

  <app-toast />
</div>
